# Render Blueprint — deploys the Express API from /server
# Dashboard: New + > Blueprint > select this repository.
services:
  - type: web
    name: daily-chronicle-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # paste your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong random value
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false            # e.g. https://your-app.vercel.app
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"
